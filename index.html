<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenkins Mazda Accessory Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f1f1; --panel:#ffffff; --ink:#101010; --ink2:#4d4d4d; --muted:#767676; --faint:#b0b0b0;
  --red:#9d1a2f; --red-dk:#7a0f22; --red-soft:rgba(157,26,47,.06); --red-line:rgba(157,26,47,.4);
  --line:rgba(0,0,0,.1); --line2:rgba(0,0,0,.24); --green:#1b8562;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
input,select,button{font-family:inherit;color:inherit;outline:none}
input::placeholder{color:var(--faint)}
.wrap{max-width:1280px;width:100%;margin:0 auto;padding:0 48px}
.shell{min-height:100vh;display:flex;flex-direction:column}

/* header */
.top{background:#101010;border-bottom:3px solid var(--red);color:#fff}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.logo{width:58px;height:58px;flex:none;fill:#e4e4e4}
.brand-name{font-size:26px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;line-height:1.1}
.brand-sub{font-size:10px;letter-spacing:.28em;color:#b4b4b4;margin-top:7px;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:28px}
.total-big{font-size:32px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.total-cap{font-size:10px;letter-spacing:.24em;color:#b4b4b4;margin-top:7px;text-align:right}
.btn-ghost{font-size:10px;font-weight:600;letter-spacing:.2em;color:#fff;border:1px solid rgba(255,255,255,.4);
  padding:10px 15px;cursor:pointer;background:none;white-space:nowrap}
.btn-ghost:hover{background:var(--red);border-color:var(--red)}

/* step nav */
.nav{background:var(--panel);border-bottom:1px solid var(--line)}
.nav-in{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.steps{display:flex;gap:34px}
.step{cursor:pointer;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;
  padding:18px 0 16px;letter-spacing:.22em;font-size:11px;font-weight:600}
.step:hover{color:var(--red)}
.step.on{color:var(--ink);border-bottom-color:var(--red)}
.veh-line{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

/* generic */
h2.title{font-size:26px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;margin:0}
h2.title::after{content:'';display:block;width:34px;height:2px;background:var(--red);margin-top:12px}
.sub{font-size:13px;color:var(--ink2);margin-top:10px}
.pane{padding:38px 48px 64px}
.cap{font-size:10px;font-weight:600;letter-spacing:.22em;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);padding:30px 32px}
.field{display:flex;flex-direction:column;gap:8px}
.field input,.field select{background:transparent;border:none;border-bottom:1px solid var(--line2);
  font-size:16px;padding:8px 0;border-radius:0;width:100%}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer}
.field input:focus,.field select:focus{border-bottom-color:var(--red)}
.btn-red{font-size:11px;letter-spacing:.22em;color:#fff;background:var(--red);padding:15px 30px;
  font-weight:600;cursor:pointer;border:none;white-space:nowrap}
.btn-red:hover{background:var(--red-dk)}
.btn-back{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--muted);cursor:pointer;background:none;border:none;padding:0}
.btn-back:hover{color:var(--red)}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:36px;flex-wrap:wrap}
.deal-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px 40px}

/* products */
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.filters{display:flex;gap:26px;flex-wrap:wrap}
.filt{font-size:11px;font-weight:600;letter-spacing:.18em;cursor:pointer;padding:0 0 6px;background:none;border:none;
  color:var(--muted);border-bottom:2px solid transparent}
.filt:hover{color:var(--red)}
.filt.on{color:var(--ink);border-bottom-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:1px;margin-top:18px}
.search{font-size:14px;padding:11px 14px;border:1px solid var(--line2);background:var(--panel);width:280px;max-width:100%;border-radius:0}
.search:focus{border-color:var(--red)}
.psku{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.pfit{font-size:11.5px;font-style:italic;color:var(--muted);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sku{font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-left:8px;font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.instbtn{display:block;margin-top:8px;font-size:9.5px;font-weight:600;letter-spacing:.12em;padding:6px 9px;cursor:pointer;background:none;border:1px dashed var(--line2);color:var(--ink2)}
.instbtn:hover{border-color:var(--red);color:var(--red)}
.instbtn.on{border:1px solid var(--ink);background:var(--ink);color:#fff}
.nosearch{display:none;padding:30px;text-align:center;font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-top:none}
.card{background:var(--panel);padding:24px 26px 22px;position:relative;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.card:hover{background:#fafafa}
.card.sel{background:#fbf3f4;box-shadow:0 0 0 1px var(--line),inset 3px 0 0 var(--red)}
.chk{position:absolute;top:22px;right:22px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.chk.on{border-color:var(--red);background:var(--red)}
.cattag{font-size:9.5px;font-weight:600;letter-spacing:.22em;color:var(--red)}
.pname{font-size:16px;font-weight:600;margin-top:10px;line-height:1.3;padding-right:34px}
.pdesc{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pricerow{display:flex;align-items:baseline;gap:3px;margin-top:12px}
.dollar{font-size:14px;color:var(--muted)}
.pinput{font-size:24px;font-weight:500;background:transparent;border:none;border-bottom:1px solid transparent;
  padding:0;width:110px;font-variant-numeric:tabular-nums}
.pinput:hover{border-bottom-color:var(--line2)}
.pinput:focus{border-bottom-color:var(--red)}
.warr{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:5px;text-transform:uppercase}
.chips{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:9px;font-weight:600;letter-spacing:.14em;padding:5px 9px;cursor:pointer;background:none;
  border:1px solid var(--line2);color:var(--muted)}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}

/* custom rows */
.custom-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-top:36px}
.hint{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.crow{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cbox{width:22px;height:22px;border-radius:50%;flex:none;cursor:pointer;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.cbox.on{border-color:var(--red);background:var(--red)}
.cname{flex:1;min-width:160px;background:transparent;border:none;border-bottom:1px solid var(--line2);font-size:14px;padding:7px 0}
.cname:focus{border-bottom-color:var(--red)}
.cprice{width:96px;background:transparent;border:none;border-bottom:1px solid var(--line2);
  font-size:20px;font-weight:500;padding:2px 0;text-align:right;font-variant-numeric:tabular-nums}
.cprice:focus{border-bottom-color:var(--red)}
.crow .chips{margin-top:0}

/* packages */
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;align-items:start}
.pkg{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ink);cursor:pointer;position:relative;transition:box-shadow .15s}
.pkg:hover{box-shadow:0 14px 30px -20px rgba(0,0,0,.5)}
.pkg.pop{border-top-color:var(--red)}
.pkg.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 16px 34px -20px rgba(157,26,47,.6);background:#fdf8f8}
.pkg-hd{display:flex;align-items:center;gap:10px;padding:20px 22px 0}
.pkg-name{font-size:13px;font-weight:600;letter-spacing:.2em}
.pkg-badge{font-size:8.5px;letter-spacing:.2em;color:#fff;background:var(--red);padding:4px 8px;font-weight:600}
.pkg-price{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 22px 0;flex-wrap:wrap}
.pkg-inp{font-size:30px;font-weight:300;background:transparent;border:none;border-bottom:1px solid transparent;
  padding:0;width:120px;font-variant-numeric:tabular-nums}
.pkg-inp:hover{border-bottom-color:var(--line2)}
.pkg-inp:focus{border-bottom-color:var(--red)}
.strike{font-size:13px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.save{font-size:9px;font-weight:600;letter-spacing:.16em;color:var(--green);border:1px solid var(--green);padding:3px 7px}
.permo{font-size:13px;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums}
.pkg-pick{font-size:9px;font-weight:600;letter-spacing:.18em;padding:8px 0 0 22px;color:var(--faint)}
.pkg-pick.on{color:var(--red)}
.pkg-rule{border-bottom:1px solid var(--line);margin:14px 22px 0}
.pkg-body{padding:8px 22px 20px}
.pkg-none{font-size:12px;color:var(--faint);padding:12px 0 4px}
.pkg-row{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.pkg-row .nm{font-size:12.5px;font-weight:500;line-height:1.3}
.leader{flex:1;min-width:12px;border-bottom:1px dotted var(--line2);position:relative;top:-3px}
.pkg-row .pr{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.note{margin-top:18px;font-size:12px;color:var(--muted);max-width:820px}
.empty{margin-top:34px;padding:44px 24px;border:1px dashed var(--line2);text-align:center;font-size:13px;color:var(--ink2);background:var(--panel)}

/* summary */
.sum-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;margin-top:34px;align-items:start}
.meta{display:flex;flex-wrap:wrap;gap:18px 30px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.meta .k{font-size:9.5px;font-weight:600;letter-spacing:.2em;color:var(--muted)}
.meta .v{font-size:13.5px;margin-top:5px}
.sline{display:flex;gap:10px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.sline .nm{font-size:14.5px;font-weight:500}
.sline .pr{font-size:14.5px;font-variant-numeric:tabular-nums}
.tot-box{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ink);padding:24px 26px 0}
.tot-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink2);padding:6px 0;font-variant-numeric:tabular-nums}
.tot-row.disc{color:var(--green)}
.tot-final{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#1a1a1a,#000);color:#fff;
  border-left:4px solid var(--red);margin:16px -26px 0;padding:18px 26px}
.tot-final .k{font-size:10px;font-weight:600;letter-spacing:.24em}
.tot-final .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.tot-mo{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:0 -26px;padding:14px 26px;color:var(--ink2)}
.tot-mo b{color:var(--red);font-size:16px;font-weight:600}
.fineprint{font-size:11.5px;line-height:1.7;color:var(--muted);margin-top:20px}

/* finance drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:var(--panel);
  border-left:3px solid var(--red);z-index:41;padding:32px;overflow-y:auto;box-shadow:-20px 0 50px -20px rgba(0,0,0,.5)}
.drawer h3{font-size:18px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;margin:0}
.x{font-size:22px;color:var(--muted);cursor:pointer;padding:0 8px;background:none;border:none}
.x:hover{color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px}
.sbtn{width:36px;height:36px;flex:none;border:1px solid var(--line2);background:none;color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.sbtn:hover{border-color:var(--red);color:var(--red)}
.taxinp{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid var(--line2);
  font-size:16px;padding:8px 0;text-align:center;font-variant-numeric:tabular-nums}
.taxinp:focus{border-bottom-color:var(--red)}
.termchip{font-size:10px;font-weight:600;letter-spacing:.12em;padding:8px 11px;cursor:pointer;background:none;
  border:1px solid var(--line2);color:var(--muted)}
.termchip:hover{border-color:var(--red);color:var(--red)}
.termchip.on{border-color:var(--red);background:var(--red);color:#fff}
.cashrow{display:flex;align-items:center;gap:12px;cursor:pointer;margin-top:4px}
.cashbox{width:20px;height:20px;border-radius:50%;flex:none;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.cashbox.on{border-color:var(--red);background:var(--red)}

@media (max-width:980px){
  .wrap{padding:0 24px} .pane{padding:30px 24px 56px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .pkgs{grid-template-columns:1fr;max-width:560px}
  .sum-grid{grid-template-columns:1fr;gap:28px}
  .deal-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .wrap{padding:0 16px} .pane{padding:24px 16px 48px}
  .logo{width:44px;height:44px} .brand{gap:12px} .brand-name{font-size:18px} .brand-sub{display:none}
  .hdr{padding:16px 0} .hdr-right{gap:10px;width:100%;justify-content:space-between}
  .total-big{font-size:24px;text-align:left} .total-cap{text-align:left}
  .btn-ghost{padding:9px 10px;letter-spacing:.14em}
  .steps{gap:18px} .step{letter-spacing:.12em;font-size:10.5px} .veh-line{display:none}
  .grid{grid-template-columns:1fr} .deal-grid{grid-template-columns:1fr} .box{padding:22px 18px}
  h2.title{font-size:20px} .btn-red{padding:14px 18px;letter-spacing:.16em}
}

/* print */
#print-sheet{display:none}
@media print{
  html,body{background:#fff}
  .shell,.scrim,.drawer{display:none !important}
  #print-sheet{display:block !important;background:#fff;color:#101010;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:letter;margin:.45in}
.p-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 14px;border-bottom:3px solid #910a2d}
.p-brand{display:flex;align-items:center;gap:14px}
.p-logo{width:50px;height:50px;fill:#101010}
.p-name{font-size:21px;font-weight:300;letter-spacing:.14em;text-transform:uppercase}
.p-tag{font-size:9.5px;font-weight:600;letter-spacing:.24em;border:1px solid #101010;padding:7px 12px}
.p-meta{display:flex;justify-content:space-between;gap:24px;padding:22px 0 0;flex-wrap:wrap}
.p-meta .k{font-size:9px;font-weight:600;letter-spacing:.2em;color:#767676}
.p-meta .v{font-size:13px;margin-top:4px}
.p-sec{font-size:10px;font-weight:600;letter-spacing:.24em;border-bottom:2px solid #101010;padding-bottom:8px}
.p-line{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.12);page-break-inside:avoid}
.p-leader{flex:1;border-bottom:1px dotted rgba(0,0,0,.4);position:relative;top:-3px}
.p-tot{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.p-total{display:flex;justify-content:space-between;align-items:baseline;border:1.5px solid #101010;border-left:4px solid #910a2d;margin-top:8px;padding:10px 14px}
.p-ack{page-break-inside:avoid}
.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:46px}
.p-rule{border-bottom:1px solid #101010;height:34px}
.p-cap{font-size:9.5px;font-weight:600;letter-spacing:.2em;color:#767676;margin-top:8px}
</style>
</head>
<body>

<div class="shell" id="app"></div>
<div id="drawer-host"></div>
<div id="print-sheet"></div>

<script>
/* ============================ DATA ============================ */
// Accessory catalogue for Jenkins Mazda, taken from igaccessories.com/jenkinsmazda on November 9, 2026.
// Prices are the catalogue's listed prices (parts only unless noted) and stay dealer-adjustable in the menu.
// PARTS: id -> [part number, name, description, category, price, fitment note, brand, installed price (0 = none listed)]

function fmt0(n){ return '$'+Math.round(n).toLocaleString('en-US'); }

  set({custom:c});
}
function setField(k,v){ set({[k]:v}); }
function pickPkg(k){ set({chosenPkg:S.chosenPkg===k?null:k}); }
function setPkgPrice(ev,k,v){
  ev.stopPropagation();
  const list=pkgData().find(function(p){return p.k===k;}).listTotal;
  const clean=v.replace(/[^0-9.]/g,'');
  const o=Object.assign({},S.pkgOv);
  o[k] = (clean===''||r2(parseFloat(clean))===list) ? null : clean;
  set({pkgOv:o});
}
function toggleSettings(){ set({showSettings:!S.showSettings}); }
function stepTax(d){
  let v = Math.round((S.taxRate+d)*2)/2;
  if(v<0) v=0; if(v>15) v=15;
  set({taxRate:v});
}
function setTax(v){ set({taxRate:Math.min(15,Math.max(0,num(v,S.taxRate)))}); }
function setTerm(t){ set({term:t}); }
function setApr(v){ set({apr:Math.min(30,Math.max(0,num(v,S.apr)))}); }
function toggleCash(){ set({cash:!S.cash}); }
function doPrint(){ window.print(); }
function resetAll(){
  if(!confirm('Clear this deal and start a new menu?')) return;
  const keep={taxRate:S.taxRate, term:S.term, apr:S.apr};
  S = Object.assign(defaults(), keep); save(); render(); window.scrollTo(0,0);
}

/* ============================ DERIVED ============================ */
function pkgData(){
  const sel = selectedItems();
  return TIERS.map(function(t){
    const k=t[0], label=t[1];
    const items = sel.filter(function(p){ return !!tiersOf(p.id)[k]; });
    const listTotal = r2(items.reduce(function(a,p){return a+p.price;},0));
    const hasOv = S.pkgOv[k]!=null && S.pkgOv[k]!=='';
    const effTotal = hasOv ? (parseFloat(S.pkgOv[k])||0) : listTotal;
    return {k:k,label:label,items:items,listTotal:listTotal,effTotal:effTotal,
      discounted: hasOv && effTotal<listTotal, priceStr: hasOv?String(S.pkgOv[k]):(listTotal%1?listTotal.toFixed(2):String(listTotal))};
  });
}
function summaryData(){
  const pk = S.chosenPkg ? pkgData().find(function(p){return p.k===S.chosenPkg;}) : null;
  const items = pk ? pk.items : selectedItems();
  const itemsSum = items.reduce(function(a,p){return a+p.price;},0);
  const eff = pk ? pk.effTotal : itemsSum;
  const disc = Math.max(0, itemsSum-eff);
  const tax = eff*S.taxRate/100;
  return {pk:pk,items:items,itemsSum:itemsSum,eff:eff,disc:disc,tax:tax,total:eff+tax};
}

/* ============================ VIEWS ============================ */
function header(){
  const sel = selectedItems();
  const sub = sel.reduce(function(a,p){return a+p.price;},0);
  return '<div class="top"><div class="wrap"><div class="hdr">'+
    '<div class="brand">'+logo('logo')+'<div><div class="brand-name">'+esc(STORE)+'</div>'+
      '<div class="brand-sub">Genuine Mazda Accessories Menu</div></div></div>'+
    '<div class="hdr-right">'+
      '<div><div class="total-big">'+fmtP(sub)+'</div>'+
      '<div class="total-cap">SELECTED · '+sel.length+' '+(sel.length===1?'ITEM':'ITEMS')+'</div></div>'+
      '<button class="btn-ghost" onclick="toggleSettings()">FINANCE</button>'+
      '<button class="btn-ghost" onclick="resetAll()">NEW DEAL</button>'+
    '</div>'+
  '</div></div></div>';
}
function nav(){
  const labels=['DEAL','PRODUCTS','PACKAGES','SUMMARY'];
  const line=[vehicle(), S.cName||''].filter(Boolean).join(' · ');
  return '<div class="nav"><div class="wrap"><div class="nav-in"><div class="steps">'+
    labels.map(function(l,i){
      return '<button class="step'+(i===S.step?' on':'')+'" onclick="go('+i+')">'+l+'</button>';
    }).join('')+
    '</div><div class="veh-line">'+esc(line)+'</div></div></div></div>';
}

function viewDeal(){
  let opts='<option value="">Select model…</option>';
  ['2026','2025'].forEach(function(y){
    opts+='<optgroup label="'+y+' models">'+Object.keys(MODELS).filter(function(m){return m.indexOf(y)===0;}).map(function(m){
      return '<option value="'+esc(m)+'"'+(S.cModel===m?' selected':'')+'>'+esc(m)+'</option>';
    }).join('')+'</optgroup>';
  });
  const f=function(cap,key,ph){
    return '<div class="field"><div class="cap">'+cap+'</div>'+
      '<input value="'+esc(S[key])+'" placeholder="'+esc(ph||'')+'" onchange="setField(\''+key+'\',this.value)"></div>';
  };
  return '<div class="wrap pane">'+
    '<h2 class="title">Deal Information</h2>'+
    '<div class="sub">Who we’re building this menu for.</div>'+
    '<div class="box" style="margin-top:30px;max-width:980px"><div class="deal-grid">'+
      f('CUSTOMER NAME','cName','Full name')+
      '<div class="field"><div class="cap">VEHICLE MODEL</div>'+
        '<select onchange="setModel(this.value)">'+opts+'</select></div>'+
      f('STOCK #','cStock','—')+
      f('VIN (LAST 8)','cVin','—')+
      f('DATE','cDate','')+
    '</div></div>'+
    '<div style="display:flex;justify-content:flex-end;margin-top:36px;max-width:980px">'+
      '<button class="btn-red" onclick="go(1)">SELECT PRODUCTS &nbsp;›</button></div>'+
  '</div>';
}

function tierChips(id){
  if(!(S.sel[id]&&S.sel[id].on)) return '';
  const t=tiersOf(id);
  return '<div class="chips">'+TIERS.map(function(x){
    return '<button class="chip'+(t[x[0]]?' on':'')+'" onclick="toggleTier(event,\''+id+'\',\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('')+'</div>';
}
function viewProducts(){
  if(!S.cModel){
    return '<div class="wrap pane"><h2 class="title">Protection &amp; Accessories</h2>'+
      '<div class="empty">Choose a vehicle model on the Deal step to see its accessories.</div>'+
      '<div class="row-end"><button class="btn-back" onclick="go(0)">‹ &nbsp;DEAL INFO</button><div></div></div></div>';
  }
  const list = products();
  const shown = list.filter(function(p){ return S.filter==='ALL'||p.cat===S.filter; });
  const cards = shown.map(function(p){
    const on = !!(S.sel[p.id]&&S.sel[p.id].on);
    const pv = S.priceOv[p.id]!=null?S.priceOv[p.id]:basePrice(p);
    const ins = isInst(p);
    return '<div class="card'+(on?' sel':'')+'" data-s="'+esc((p.name+' '+p.sku+' '+p.cat).toLowerCase())+'" onclick="toggleItem(\''+p.id+'\')">'+
      '<div class="chk'+(on?' on':'')+'">'+(on?'✓':'')+'</div>'+
      '<div class="cattag">'+esc(p.cat.toUpperCase())+'</div>'+
      '<div class="pname">'+esc(p.name)+'</div>'+
      '<div class="psku">PART # '+esc(p.sku)+'</div>'+
      '<div class="pdesc" title="'+esc(p.desc)+'">'+esc(p.desc)+'</div>'+
      (p.fit?'<div class="pfit" title="'+esc(p.fit)+'">'+esc(p.fit)+'</div>':'')+
      '<div class="pricerow"><div class="dollar">$</div>'+
        '<input class="pinput" inputmode="decimal" value="'+esc(pv)+'" onclick="event.stopPropagation()" '+
        'onchange="setPrice(\''+p.id+'\',this.value)"></div>'+
      (p.instPrice?'<button class="instbtn'+(ins?' on':'')+'" onclick="toggleInst(event,\''+p.id+'\')">'+(ins?'✓ INSTALLED PRICE · PART ONLY '+fmtP(p.price):'+ INSTALLED '+fmtP(p.instPrice))+'</button>':'')+
      '<div class="warr">'+(p.brand==='Mazda'?WARRANTY:esc(p.brand)+' · Dealer Accessory')+'</div>'+
      tierChips(p.id)+
    '</div>';
  }).join('');

  const rows = ['c1','c2'].map(function(k){
    const on=!!(S.sel[k]&&S.sel[k].on), r=S.custom[k]||{name:'',price:''};
    return '<div class="crow">'+
      '<div class="cbox'+(on?' on':'')+'" onclick="toggleItem(\''+k+'\')">'+(on?'✓':'')+'</div>'+
      '<input class="cname" value="'+esc(r.name)+'" placeholder="Describe item — e.g. window tint, paint protection, detail package…" '+
        'onchange="setCustom(\''+k+'\',\'name\',this.value)">'+
      '<div style="display:flex;align-items:baseline;gap:4px"><div class="dollar">$</div>'+
        '<input class="cprice" inputmode="decimal" placeholder="0" value="'+esc(r.price)+'" '+
        'onchange="setCustom(\''+k+'\',\'price\',this.value)"></div>'+
      tierChips(k)+
    '</div>';
  }).join('');

  const sel=selectedItems();
  const sub=sel.reduce(function(a,p){return a+p.price;},0);
  const have={}; list.forEach(function(p){ have[p.cat]=1; });
  const filters=['ALL'].concat(CAT_ORDER.filter(function(c){return have[c];})).map(function(c){
    return '<button class="filt'+(S.filter===c?' on':'')+'" onclick="setFilter(\''+c.replace(/&/g,'&amp;')+'\')">'+esc(c.toUpperCase())+'</button>';
  }).join('');

  return '<div class="wrap pane">'+
    '<div class="head-row">'+
      '<div><h2 class="title">Protection &amp; Accessories</h2>'+
      '<div class="sub" style="max-width:520px">'+list.length+' accessories for your '+esc(vehicle())+
      '. Select individually, or build packages on the next step.</div></div>'+
      '<input class="search" id="q" type="search" placeholder="Search name or part #…" oninput="applySearch(this.value)">'+
    '</div>'+
    '<div class="filters" style="margin-top:24px">'+filters+'</div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="nosearch" id="nosearch">No accessories match that search.</div>'+
    '<div class="custom-hd"><div class="cap" style="color:var(--ink)">CUSTOM ITEMS</div>'+
      '<div class="hint">PRICES ON ANY CARD CAN BE TAPPED &amp; ADJUSTED</div></div>'+
    rows+
    '<div class="row-end">'+
      '<button class="btn-back" onclick="go(0)">‹ &nbsp;DEAL INFO</button>'+
      '<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">'+
        '<div style="font-size:13px;color:var(--ink2)">'+
        (sel.length? sel.length+(sel.length===1?' item · ':' items · ')+fmtP(sub) : 'No items selected')+'</div>'+
        '<button class="btn-red" onclick="go(2)">BUILD PACKAGES &nbsp;›</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function viewPackages(){
  const pkgs=pkgData();
  const anySel = selectedItems().length>0;
  let body;
  if(!anySel){
    body='<div class="empty">No items selected yet — go back to Products to add items.</div>';
  } else {
    body='<div class="pkgs">'+pkgs.map(function(p){
      const chosen=S.chosenPkg===p.k, pop=p.k===POPULAR;
      const withTax=p.effTotal*(1+S.taxRate/100);
      return '<div class="pkg'+(pop?' pop':'')+(chosen?' on':'')+'" onclick="pickPkg(\''+p.k+'\')">'+
        '<div class="pkg-hd"><div class="pkg-name">'+p.label+'</div>'+
          (pop?'<div class="pkg-badge">MOST POPULAR</div>':'')+'</div>'+
        '<div class="pkg-price"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+
          '<div style="display:flex;align-items:baseline;gap:3px"><div class="dollar" style="font-size:16px">$</div>'+
          '<input class="pkg-inp" inputmode="decimal" value="'+esc(p.priceStr)+'" title="Tap to set a package price" onclick="event.stopPropagation()" '+
          'onchange="setPkgPrice(event,\''+p.k+'\',this.value)"></div>'+
          (p.discounted?'<div class="strike">'+fmtP(p.listTotal)+'</div>':'')+
          (p.discounted?'<div class="save">SAVE '+fmtP(p.listTotal-p.effTotal)+'</div>':'')+
        '</div>'+
        '<div class="permo">'+(showMonthly()&&p.effTotal>0?'+'+fmt0(monthly(withTax))+' / mo':'')+'</div></div>'+
        '<div class="pkg-pick'+(chosen?' on':'')+'">'+(chosen?'✓ SELECTED FOR SUMMARY':'TAP TO SELECT')+'</div>'+
        '<div class="pkg-rule"></div>'+
        '<div class="pkg-body">'+(p.items.length?p.items.map(function(it){
          return '<div class="pkg-row"><div class="nm">'+esc(it.name)+skuTag(it)+'</div><div class="leader"></div>'+
            '<div class="pr">'+fmtP(it.price)+'</div></div>';
        }).join(''):'<div class="pkg-none">No items in this package yet.</div>')+'</div>'+
      '</div>';
    }).join('')+'</div>'+
    '<div class="note">Tap a package to select it — the Summary and printed menu will show that package’s products and price. Tap a package price to set a discounted price. The Essential / Premium / Deluxe toggles on the Products page control what’s in each.</div>';
  }
  return '<div class="wrap pane">'+
    '<h2 class="title">Build Packages</h2>'+
    '<div class="sub">Three ways to say yes — built automatically from your product selections.</div>'+
    body+
    '<div class="row-end">'+
      '<button class="btn-back" onclick="go(1)">‹ &nbsp;PRODUCTS</button>'+
      '<button class="btn-red" onclick="go(3)">REVIEW &amp; SIGN &nbsp;›</button>'+
    '</div>'+
  '</div>';
}

function metaHtml(){
  return [['CUSTOMER',S.cName||'—'],['VEHICLE',vehicle()||'—'],['STOCK',S.cStock||'—'],
    ['VIN (LAST 8)',S.cVin||'—'],['DATE',S.cDate||'—']].map(function(m){
    return '<div><div class="k">'+m[0]+'</div><div class="v">'+esc(m[1])+'</div></div>';
  }).join('');
}
function viewSummary(){
  const d=summaryData();
  const lines = d.items.length ? d.items.map(function(it){
    return '<div class="sline"><div class="nm">'+esc(it.name)+skuTag(it)+'</div><div class="leader"></div>'+
      '<div class="pr">'+fmtP(it.price)+'</div></div>';
  }).join('') : '<div class="empty" style="margin-top:24px">No items selected — go to Products to add items.</div>';

  return '<div class="wrap pane">'+
    '<div class="head-row">'+
      '<div><h2 class="title">Review &amp; Sign</h2><div class="sub" style="max-width:640px">'+
        (d.pk ? TIER_NAMES[d.pk.k]+' Package selected — confirm below, then print for signatures.'
              : 'Confirm the selections below, then print for signatures. Tip: tap a package on the Packages page to summarize that package instead.')+
      '</div></div>'+
      '<button class="btn-red" onclick="doPrint()">PRINT MENU &nbsp;⎙</button>'+
    '</div>'+
    '<div class="sum-grid">'+
      '<div><div class="meta">'+metaHtml()+'</div>'+lines+'</div>'+
      '<div><div class="tot-box">'+
        '<div class="tot-row"><div>Subtotal</div><div>'+fmt2(d.itemsSum)+'</div></div>'+
        (d.disc>0?'<div class="tot-row disc"><div>Package Discount</div><div>−'+fmt2(d.disc)+'</div></div>':'')+
        '<div class="tot-row"><div>Sales Tax ('+S.taxRate.toFixed(1)+'%)</div><div>'+fmt2(d.tax)+'</div></div>'+
        '<div class="tot-final"><div class="k">TOTAL</div><div class="v">'+fmt2(d.total)+'</div></div>'+
        (showMonthly()?'<div class="tot-mo"><div>Monthly Payment Est. ('+S.term+' mo)</div><div><b>'+
          fmt0(monthly(d.total))+'</b> / mo</div></div>':'<div style="height:10px"></div>')+
      '</div>'+
      '<div class="fineprint">All prices pre-tax; tax reflected in total. Monthly estimates are illustrative, based on Finance settings. Genuine Mazda Accessories are backed by Mazda’s warranty. Listed prices are for the part only unless marked installed. Signatures are collected on the printed menu.</div>'+
      '</div>'+
    '</div>'+
    '<div class="row-end"><button class="btn-back" onclick="go(2)">‹ &nbsp;PACKAGES</button><div></div></div>'+
  '</div>';
}

function viewDrawer(){
  if(!S.showSettings) return '';
  const chips=[24,36,48,60,72,84].map(function(t){
    return '<button class="termchip'+(t===S.term?' on':'')+'" onclick="setTerm('+t+')">'+t+' MO</button>';
  }).join('');
  return '<div class="scrim" onclick="toggleSettings()"></div>'+
  '<div class="drawer">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<h3>Finance Settings</h3><button class="x" onclick="toggleSettings()">×</button></div>'+
    '<div style="margin-top:32px;display:flex;flex-direction:column;gap:28px">'+
      '<div class="field"><div class="cap">SALES TAX RATE (%)</div>'+
        '<div class="stepper">'+
          '<button class="sbtn" onclick="stepTax(-0.5)">−</button>'+
          '<input class="taxinp" inputmode="decimal" value="'+S.taxRate.toFixed(1)+'" onchange="setTax(this.value)">'+
          '<button class="sbtn" onclick="stepTax(0.5)">+</button>'+
        '</div>'+
        '<div style="font-size:10.5px;color:var(--muted);letter-spacing:.04em">Steps by 0.5% — Marion 7.5, Alachua 7.0, Lake 7.0, Citrus 6.5</div>'+
      '</div>'+
      '<div class="field"><div class="cap">FINANCE TERM</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:6px">'+chips+'</div></div>'+
      '<div class="field"><div class="cap">INTEREST RATE (% APR)</div>'+
        '<input value="'+S.apr+'" inputmode="decimal" onchange="setApr(this.value)"></div>'+
      '<div class="cashrow" onclick="toggleCash()">'+
        '<div class="cashbox'+(S.cash?' on':'')+'">'+(S.cash?'✓':'')+'</div>'+
        '<div style="font-size:13px;color:var(--ink2)">Cash deal — hide monthly estimate</div></div>'+
    '</div>'+
  '</div>';
}

function viewPrint(){
  const d=summaryData();
  return ''+
  '<div class="p-bar"><div class="p-brand">'+logo('p-logo')+'<div class="p-name">'+esc(STORE)+'</div></div>'+
    '<div class="p-tag">ACCESSORY MENU</div></div>'+
  '<div class="p-meta meta" style="border:none;padding-bottom:0">'+metaHtml()+'</div>'+
  '<div style="padding:22px 0 0">'+
    '<div class="p-sec">'+(d.pk?'SELECTED PRODUCTS · '+TIER_NAMES[d.pk.k].toUpperCase()+' PACKAGE':'SELECTED PRODUCTS')+'</div>'+
    (d.items.length?d.items.map(function(it){
      return '<div class="p-line"><div style="font-size:12.5px;font-weight:500">'+esc(it.name)+'</div>'+
        (it.sku?'<div style="font-size:10.5px;color:#555;white-space:nowrap">Part # '+esc(it.sku)+(it.inst?' · Installed':'')+'</div>':'')+
        '<div class="p-leader"></div><div style="font-size:13px;font-variant-numeric:tabular-nums">'+fmtP(it.price)+'</div></div>';
    }).join(''):'<div class="p-line" style="color:#767676;font-size:12px">No products selected.</div>')+
  '</div>'+
  '<div style="display:flex;justify-content:flex-end;padding:18px 0 0;page-break-inside:avoid"><div style="width:320px">'+
    '<div class="p-tot"><div>Subtotal</div><div>'+fmt2(d.itemsSum)+'</div></div>'+
    (d.disc>0?'<div class="p-tot" style="color:#1b8562"><div>Package Discount</div><div>−'+fmt2(d.disc)+'</div></div>':'')+
    '<div class="p-tot"><div>Sales Tax ('+S.taxRate.toFixed(1)+'%)</div><div>'+fmt2(d.tax)+'</div></div>'+
    '<div class="p-total"><div style="font-size:10px;font-weight:600;letter-spacing:.22em">TOTAL</div>'+
      '<div style="font-size:24px;font-weight:600;font-variant-numeric:tabular-nums">'+fmt2(d.total)+'</div></div>'+
    (showMonthly()?'<div class="p-tot" style="color:#555;font-size:11px;margin-top:6px"><div>Monthly Payment Est. ('+S.term+' mo)</div><div>'+
      fmt0(monthly(d.total))+' / mo</div></div>':'')+
  '</div></div>'+
  '<div class="p-ack" style="padding:26px 0 0">'+
    '<div class="p-sec">CUSTOMER ACKNOWLEDGMENT</div>'+
    '<div style="font-size:11px;line-height:1.7;color:#333;margin-top:12px">I have been presented with the above accessory and protection products by the dealership. The items selected have been agreed to at the prices listed. I understand all products are optional and my selections are reflected by my signature below.</div>'+
    '<div class="p-sign">'+
      '<div><div class="p-rule"></div><div class="p-cap">CUSTOMER SIGNATURE &nbsp;·&nbsp; DATE</div></div>'+
      '<div><div class="p-rule"></div><div class="p-cap">SALES ASSOCIATE &nbsp;·&nbsp; DATE</div></div>'+
    '</div>'+
    '<div style="font-size:9.5px;line-height:1.7;color:#767676;margin-top:30px">All prices shown are pre-tax; sales tax is applied and reflected in the total above. Monthly payment estimates are illustrative only; final payment amounts will be reflected in your financing contract. Genuine Mazda Accessories are backed by Mazda’s warranty. Listed prices are for the part only unless marked installed. Products and prices are subject to change without notice. '+esc(STORE)+'.</div>'+
  '</div>';
}

/* ============================ SEARCH ============================ */
let Q='';
function applySearch(v){
  Q=(v||'').trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.grid .card').forEach(function(c){
    const hit=!Q||c.getAttribute('data-s').indexOf(Q)>=0;
    c.style.display=hit?'':'none'; if(hit) shown++;
  });
  const n=document.getElementById('nosearch'); if(n) n.style.display=shown?'none':'block';
}

/* ============================ RENDER ============================ */
function render(){
  const views=[viewDeal,viewProducts,viewPackages,viewSummary];
  document.getElementById('app').innerHTML = header()+nav()+(views[S.step]||viewDeal)();
  document.getElementById('drawer-host').innerHTML = viewDrawer();
  document.getElementById('print-sheet').innerHTML = viewPrint();
  const q=document.getElementById('q');
  if(q){ q.value=Q; if(Q) applySearch(Q); }
}
render();
</script>
